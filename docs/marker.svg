  <text x="105" y="262" text-anchor="middle" font-size="4">Stick it flat on a wall or the floor in the first room. Film it from 3+ angles, 0.5 to 2 m away.</text>
  <text x="105" y="270" text-anchor="middle" font-size="4">If it prints at another size, pass --marker-size (metres), e.g. --marker-size 0.148</text>
